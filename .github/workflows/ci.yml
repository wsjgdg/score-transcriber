name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg lilypond

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run app import + health check
        run: |
          python -c "import app; print('app import OK')"
          # 用 TestClient 启动并访问首页与静态资源，验证路由可用
          python - <<'PY'
          from fastapi.testclient import TestClient
          import app as appmod
          c = TestClient(appmod.app)
          assert c.get("/").status_code in (200, 302), "根路径异常"
          assert c.get("/app.html").status_code == 200, "上传页异常"
          assert c.get("/view.html").status_code == 200, "历史查看页异常"
          assert c.get("/static/player.js").status_code == 200, "播放器脚本异常"
          # 历史记录接口（GET 应返回 ok；清空接口应可用；无效 id 应 404）
          assert c.get("/api/history").status_code == 200, "历史接口异常"
          assert c.post("/api/history/clear").status_code == 200, "清空历史接口异常"
          assert c.get("/api/history/__not_exist__").status_code == 404, "无效历史 id 应 404"
          assert c.get("/healthz").status_code == 200, "健康检查端点异常"
          print("路由检查 OK")
          PY

      - name: Run unit tests
        run: |
          python -m pytest -q
